services:
  - type: web
    name: security-dues-personal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node serve.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NODE_ENV
        value: production
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
