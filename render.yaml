services:
  - type: web
    name: security-dues
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node serve.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
    disk:
      name: security-dues-data
      mountPath: /var/data
      sizeGB: 1
